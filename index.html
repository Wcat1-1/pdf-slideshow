<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 viewport-fit=cover">

  <meta name="apple-mobile-web-app-capable"
        content="yes">

  <meta name="apple-mobile-web-app-status-bar-style"
        content="black">

  <title>PDF Slideshow</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #111;
      color: white;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* PDF選択画面 */
    #startScreen {
      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      text-align: center;

      padding:
        env(safe-area-inset-top)
        20px
        env(safe-area-inset-bottom);
    }

    h1 {
      font-size: 32px;
      margin: 0 0 12px;
    }

    #startScreen p {
      color: #aaa;
      margin-bottom: 32px;
    }

    .selectButton {
      display: inline-block;
      padding: 16px 28px;

      background: white;
      color: #111;

      border-radius: 14px;

      font-size: 18px;
      font-weight: 600;

      cursor: pointer;
    }

    #pdfInput {
      display: none;
    }

    /* PDF表示画面 */
    #viewerScreen {
      display: none;

      width: 100%;
      height: 100vh;
      height: 100dvh;

      flex-direction: column;
    }

    #topBar {
      min-height: 56px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding:
        calc(8px + env(safe-area-inset-top))
        14px
        8px;

      background: rgba(20, 20, 20, 0.95);
    }

    #fileName {
      flex: 1;

      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;

      font-size: 14px;
      text-align: left;
    }

    #pageInfo {
      margin-left: 12px;
      font-size: 14px;
      color: #ccc;
    }

    #pdfArea {
      flex: 1;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: auto;

      padding: 10px;
    }

    #pdfCanvas {
      display: block;

      max-width: 100%;
      max-height: 100%;

      background: white;

      box-shadow:
        0 4px 20px rgba(0,0,0,0.45);
    }

    #loading {
      position: fixed;
      inset: 0;

      display: none;
      align-items: center;
      justify-content: center;

      background: rgba(0,0,0,0.7);

      z-index: 100;
    }

    #loadingBox {
      padding: 18px 24px;

      background: #222;

      border-radius: 14px;

      font-weight: 600;
    }

    #errorMessage {
      display: none;

      padding: 20px;

      color: #ff8080;

      text-align: center;
    }
  </style>
</head>


<body>

  <!-- PDF選択画面 -->
  <section id="startScreen">

    <h1>PDF Slideshow</h1>

    <p>表示するPDFを選択してください</p>

    <label
      class="selectButton"
      for="pdfInput">
      PDFを選択
    </label>

    <input
      id="pdfInput"
      type="file"
      accept="application/pdf,.pdf"
    >

    <div id="errorMessage"></div>

  </section>


  <!-- PDF表示画面 -->
  <section id="viewerScreen">

    <div id="topBar">

      <div id="fileName">
        PDF
      </div>

      <div id="pageInfo">
        1 / 1
      </div>

    </div>


    <div id="pdfArea">

      <canvas id="pdfCanvas"></canvas>

    </div>

  </section>


  <!-- 読み込み表示 -->
  <div id="loading">

    <div id="loadingBox">
      PDFを読み込み中...
    </div>

  </div>


  <!-- PDF.js -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
    type="module">
  </script>


  <script type="module">

    import * as pdfjsLib
      from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";


    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";


    const pdfInput =
      document.getElementById("pdfInput");

    const startScreen =
      document.getElementById("startScreen");

    const viewerScreen =
      document.getElementById("viewerScreen");

    const canvas =
      document.getElementById("pdfCanvas");

    const context =
      canvas.getContext("2d");

    const fileName =
      document.getElementById("fileName");

    const pageInfo =
      document.getElementById("pageInfo");

    const loading =
      document.getElementById("loading");

    const errorMessage =
      document.getElementById("errorMessage");


    let pdfDocument = null;

    let currentPage = 1;


    async function renderPage(pageNumber) {

      const page =
        await pdfDocument.getPage(pageNumber);


      const originalViewport =
        page.getViewport({
          scale: 1
        });


      /*
        iPhoneの画面幅に合わせて
        PDFを縮小・拡大します。
      */

      const availableWidth =
        window.innerWidth - 20;

      const availableHeight =
        window.innerHeight - 100;


      const widthScale =
        availableWidth /
        originalViewport.width;

      const heightScale =
        availableHeight /
        originalViewport.height;


      const scale =
        Math.min(
          widthScale,
          heightScale
        );


      /*
        Retinaディスプレイ対応
      */

      const pixelRatio =
        window.devicePixelRatio || 1;


      const viewport =
        page.getViewport({
          scale:
            scale * pixelRatio
        });


      canvas.width =
        viewport.width;

      canvas.height =
        viewport.height;


      canvas.style.width =
        `${viewport.width / pixelRatio}px`;

      canvas.style.height =
        `${viewport.height / pixelRatio}px`;


      await page.render({

        canvasContext:
          context,

        viewport:
          viewport

      }).promise;


      pageInfo.textContent =
        `${pageNumber} / ${pdfDocument.numPages}`;
    }


    pdfInput.addEventListener(
      "change",
      async function () {

        const file =
          pdfInput.files[0];


        if (!file) {
          return;
        }


        loading.style.display =
          "flex";

        errorMessage.style.display =
          "none";


        try {

          const arrayBuffer =
            await file.arrayBuffer();


          pdfDocument =
            await pdfjsLib
              .getDocument({
                data: arrayBuffer
              })
              .promise;


          currentPage = 1;


          fileName.textContent =
            file.name;


          startScreen.style.display =
            "none";

          viewerScreen.style.display =
            "flex";


          await renderPage(
            currentPage
          );


        } catch (error) {

          console.error(error);


          errorMessage.textContent =
            "PDFを読み込めませんでした。別のPDFで試してください。";

          errorMessage.style.display =
            "block";


          startScreen.style.display =
            "flex";

          viewerScreen.style.display =
            "none";

        }


        loading.style.display =
          "none";

      }
    );

  </script>

</body>
</html>
