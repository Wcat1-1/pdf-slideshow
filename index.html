<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 viewport-fit=cover">

  <meta name="apple-mobile-web-app-capable"
        content="yes">

  <meta name="apple-mobile-web-app-status-bar-style"
        content="black">

  <title>PDF Slideshow</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #111;
      color: white;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

      overflow: hidden;
    }

    button {
      font: inherit;
    }

    /* =========================
       PDF選択画面
       ========================= */

    #startScreen {
      width: 100%;
      height: 100vh;
      height: 100dvh;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      padding:
        env(safe-area-inset-top)
        20px
        env(safe-area-inset-bottom);

      text-align: center;
    }

    #startScreen h1 {
      margin: 0 0 12px;
      font-size: 32px;
    }

    #startScreen p {
      margin: 0 0 32px;
      color: #aaa;
    }

    .selectButton {
      display: inline-block;

      padding: 16px 28px;

      background: white;
      color: #111;

      border-radius: 14px;

      font-size: 18px;
      font-weight: 700;

      cursor: pointer;
    }

    #pdfInput {
      display: none;
    }

    #errorMessage {
      display: none;

      margin-top: 22px;

      color: #ff8080;
    }


    /* =========================
       PDF表示画面
       ========================= */

    #viewerScreen {
      display: none;

      width: 100%;
      height: 100vh;
      height: 100dvh;

      flex-direction: column;

      background: #111;
    }


    /* 上部バー */

    #topBar {
      flex-shrink: 0;

      display: flex;
      align-items: center;

      min-height: 58px;

      padding:
        calc(8px + env(safe-area-inset-top))
        14px
        8px;

      background: rgba(20,20,20,0.96);

      border-bottom:
        1px solid rgba(255,255,255,0.08);
    }

    #fileName {
      flex: 1;

      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;

      font-size: 14px;
      font-weight: 600;
    }

    #pageInfo {
      flex-shrink: 0;

      margin-left: 12px;

      color: #ccc;

      font-size: 14px;
    }


    /* PDF表示領域 */

    #pdfArea {
      position: relative;

      flex: 1;

      min-height: 0;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;

      padding: 8px;
    }

    #pdfCanvas {
      display: block;

      background: white;

      box-shadow:
        0 4px 20px rgba(0,0,0,0.5);
    }

    #pdfCanvas {
  transition: opacity 0.28s ease;
}

#pdfCanvas.pageFadeOut {
  opacity: 0;
}


    /* =========================
       下部操作バー
       ========================= */

    #bottomBar {
      flex-shrink: 0;

      display: grid;

      grid-template-columns:
        1fr 1.15fr 1fr;

      gap: 10px;

      padding:
        10px
        12px
        calc(10px + env(safe-area-inset-bottom));

      background: rgba(20,20,20,0.96);

      border-top:
        1px solid rgba(255,255,255,0.08);
    }

    .controlButton {
      min-height: 50px;

      border: 0;

      border-radius: 14px;

      background: #2c2c2e;
      color: white;

      font-size: 16px;
      font-weight: 600;

      cursor: pointer;
    }

    .controlButton:active {
      transform: scale(0.96);
    }

    #playButton {
      background: white;
      color: #111;
    }

    .controlButton:disabled {
      opacity: 0.35;
    }


    /* =========================
       読み込み表示
       ========================= */

    #loading {
      position: fixed;

      inset: 0;

      display: none;
      justify-content: center;
      align-items: center;

      z-index: 100;

      background: rgba(0,0,0,0.7);
    }

    #loadingBox {
      padding: 18px 24px;

      background: #222;

      border-radius: 14px;

      font-weight: 600;
    }
    
#playbackSettings {
  flex-shrink: 0;

  display: flex;
  justify-content: space-between;
  align-items: center;

  gap: 14px;

  padding: 8px 14px;

  background: rgba(20,20,20,0.96);

  color: #ccc;
  font-size: 14px;
}

.settingItem,
.loopSetting {
  display: flex;
  align-items: center;

  gap: 8px;
}

#intervalSelect {
  padding: 7px 10px;

  border: 0;
  border-radius: 10px;

  background: #2c2c2e;
  color: white;

  font-size: 14px;
}

#loopToggle {
  width: 20px;
  height: 20px;

  accent-color: white;
}
  #jumpSettings {
  flex-shrink: 0;

  display: flex;
  justify-content: center;
  align-items: center;

  gap: 8px;
  padding: 7px 12px;

  background: rgba(20,20,20,0.96);

  color: #ccc;
  font-size: 14px;
}

#pageInput {
  width: 62px;

  padding: 7px 8px;

  border: 0;
  border-radius: 9px;

  background: #2c2c2e;
  color: white;

  font-size: 16px;
  text-align: center;
}

#jumpButton {
  padding: 7px 14px;

  border: 0;
  border-radius: 9px;

  background: #3a3a3c;
  color: white;

  font-size: 14px;
  font-weight: 600;
}

    /* =========================
   全画面表示
   ========================= */

#topBar,
#playbackSettings,
#jumpSettings,
#bottomBar {
  transition:
    opacity 0.25s ease,
    max-height 0.25s ease,
    padding 0.25s ease;
}

/* 操作パネルを隠した状態 */
#viewerScreen.controlsHidden #topBar,
#viewerScreen.controlsHidden #playbackSettings,
#viewerScreen.controlsHidden #jumpSettings,
#viewerScreen.controlsHidden #bottomBar {
  opacity: 0;
  max-height: 0;
  min-height: 0;
  padding-top: 0;
  padding-bottom: 0;
  overflow: hidden;
  pointer-events: none;
}
    
  </style>
</head>


<body>


  <!-- =======================
       PDF選択
       ======================= -->

  <section id="startScreen">

    <h1>PDF Slideshow</h1>

    <p>
      表示するPDFを選択してください
    </p>

    <label
      class="selectButton"
      for="pdfInput">

      PDFを選択

    </label>

    <input
      id="pdfInput"
      type="file"
      accept="application/pdf,.pdf">

    <div id="errorMessage"></div>

  </section>



  <!-- =======================
       PDF Viewer
       ======================= -->

  <section id="viewerScreen">


    <header id="topBar">

      <div id="fileName">
        PDF
      </div>

      <div id="pageInfo">
        1 / 1
      </div>

    </header>



    <main id="pdfArea">

      <canvas id="pdfCanvas"></canvas>

    </main>


<div id="playbackSettings">

  <div class="settingItem">

    <span>再生間隔</span>

    <select id="intervalSelect">
      <option value="1000">1秒</option>
      <option value="2000">2秒</option>
      <option value="3000" selected>3秒</option>
      <option value="5000">5秒</option>
      <option value="10000">10秒</option>
    </select>

  </div>


  <label class="loopSetting">

    <input
      id="loopToggle"
      type="checkbox"
      checked>

    <span>ループ</span>

  </label>

</div>

    <div id="jumpSettings">

  <span>ページ</span>

  <input
    id="pageInput"
    type="number"
    inputmode="numeric"
    min="1"
    value="1"
  >

  <span id="jumpTotal">/ 1</span>

  <button id="jumpButton">
    移動
  </button>

</div>
    
    <footer id="bottomBar">

      <button
        id="prevButton"
        class="controlButton">

        ◀︎ 前へ

      </button>


      <button
        id="playButton"
        class="controlButton">

        ▶︎ 再生

      </button>


      <button
        id="nextButton"
        class="controlButton">

        次へ ▶︎

      </button>

    </footer>


  </section>



  <!-- 読み込み中 -->

  <div id="loading">

    <div id="loadingBox">
      PDFを読み込み中...
    </div>

  </div>



  <script type="module">

    import * as pdfjsLib
      from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";


    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";



    /* =========================
       要素取得
       ========================= */

    const pdfInput =
      document.getElementById("pdfInput");

    const startScreen =
      document.getElementById("startScreen");

    const viewerScreen =
      document.getElementById("viewerScreen");

    const canvas =
      document.getElementById("pdfCanvas");

    const context =
      canvas.getContext("2d");

    const fileName =
      document.getElementById("fileName");

    const pageInfo =
      document.getElementById("pageInfo");

    const prevButton =
      document.getElementById("prevButton");

    const playButton =
      document.getElementById("playButton");

    const nextButton =
      document.getElementById("nextButton");

    const loading =
      document.getElementById("loading");

    const errorMessage =
      document.getElementById("errorMessage");

    const pdfArea =
      document.getElementById("pdfArea");

    const intervalSelect =
  document.getElementById("intervalSelect");

    const loopToggle =
  document.getElementById("loopToggle");

    const pageInput =
  document.getElementById("pageInput");

const jumpTotal =
  document.getElementById("jumpTotal");

const jumpButton =
  document.getElementById("jumpButton");



    /* =========================
       状態
       ========================= */

    let pdfDocument = null;

    let currentPage = 1;

    let isRendering = false;

    let isPlaying = false;

    let playTimer = null;

    let controlsHidden = false;


    /*
      最初は3秒ごとに
      ページを送ります。
    */

    let slideInterval = 3000;

    function wait(ms) {
  return new Promise(
    resolve => setTimeout(resolve, ms)
  );
}

    async function toggleControls() {

  if (!pdfDocument || isRendering) {
    return;
  }

  controlsHidden =
    !controlsHidden;

  viewerScreen.classList.toggle(
    "controlsHidden",
    controlsHidden
  );

  /*
    操作パネルのアニメーションが
    終わるのを待つ
  */

  await wait(280);

  /*
    PDFを新しい表示領域に合わせて
    再描画する
  */

  isRendering = false;

  await renderPage(
    currentPage,
    false
  );
}


/*
  PDF表示部分をタップしたとき
*/

pdfArea.addEventListener(
  "click",
  async event => {

    event.preventDefault();

    await toggleControls();

  }
);

      pdfArea.addEventListener(
  "click",
  async event => {

    /*
      PDF表示領域をタップしたときだけ
      操作パネルを切り替える
    */

    event.preventDefault();

    await toggleControls();

  }
);

  controlsHidden =
    !controlsHidden;

  viewerScreen.classList.toggle(
    "controlsHidden",
    controlsHidden
  );

  /*
    操作パネルのアニメーションが
    終わるのを少し待つ
  */

  await wait(280);

  /*
    PDF表示領域が広がった／狭くなったので
    現在ページを新しいサイズで再描画
  */

  isRendering = false;

  await renderPage(
    currentPage,
    false
  );
}

    intervalSelect.addEventListener(
  "change",
  () => {

    slideInterval =
      Number(intervalSelect.value);

    /*
      再生中に変更した場合は
      新しい秒数でタイマーを作り直す
    */

    if (isPlaying) {

      stopPlayback();
      startPlayback();

    }

  }
);



    /* =========================
       PDF描画
       ========================= */

    async function renderPage(
  pageNumber,
  animate = true
) {

      if (
        !pdfDocument ||
        isRendering
      ) {
        return;
      }


      isRendering = true;

if (animate) {

  canvas.classList.add(
    "pageFadeOut"
  );

  await wait(280);

}

try {

        const page =
          await pdfDocument.getPage(
            pageNumber
          );


        const originalViewport =
          page.getViewport({
            scale: 1
          });


        /*
          実際のPDF表示領域のサイズを
          取得します。
        */

        const areaWidth =
          Math.max(
            pdfArea.clientWidth - 16,
            1
          );

        const areaHeight =
          Math.max(
            pdfArea.clientHeight - 16,
            1
          );


        const widthScale =
          areaWidth /
          originalViewport.width;

        const heightScale =
          areaHeight /
          originalViewport.height;


        const displayScale =
          Math.min(
            widthScale,
            heightScale
          );


        /*
          Retina対応。
          描画データは高解像度、
          CSS表示サイズは実寸にします。
        */

        const pixelRatio =
          Math.min(
            window.devicePixelRatio || 1,
            2
          );


        const renderViewport =
          page.getViewport({

            scale:
              displayScale *
              pixelRatio

          });


        canvas.width =
          Math.floor(
            renderViewport.width
          );

        canvas.height =
          Math.floor(
            renderViewport.height
          );


        canvas.style.width =
          `${
            renderViewport.width /
            pixelRatio
          }px`;

        canvas.style.height =
          `${
            renderViewport.height /
            pixelRatio
          }px`;


        context.clearRect(
          0,
          0,
          canvas.width,
          canvas.height
        );


        await page.render({

          canvasContext:
            context,

          viewport:
            renderViewport

        }).promise;


        currentPage =
          pageNumber;

        pageInput.value =
  currentPage;


        pageInfo.textContent =
          `${currentPage} / ${pdfDocument.numPages}`;


        updateButtons();

  requestAnimationFrame(
  () => {
    canvas.classList.remove(
      "pageFadeOut"
    );
  }
);

} catch (error) {

  console.error(
    "Page render error:",
    error
  );

  canvas.classList.remove(
    "pageFadeOut"
  );

} finally {

  isRendering = false;

}

    }



    /* =========================
       ボタン状態
       ========================= */

    function updateButtons() {

      if (!pdfDocument) {
        return;
      }


      prevButton.disabled =
        currentPage <= 1;


      /*
        自動再生中は最終ページでも
        次へボタンを無効にします。
      */

      nextButton.disabled =
        currentPage >=
        pdfDocument.numPages;

    }



    /* =========================
       前ページ
       ========================= */

    prevButton.addEventListener(
      "click",
      async () => {

        if (
          !pdfDocument ||
          isRendering ||
          currentPage <= 1
        ) {
          return;
        }


        await renderPage(
          currentPage - 1
        );

      }
    );



    /* =========================
       次ページ
       ========================= */

    nextButton.addEventListener(
      "click",
      async () => {

        if (
          !pdfDocument ||
          isRendering ||
          currentPage >=
            pdfDocument.numPages
        ) {
          return;
        }


        await renderPage(
          currentPage + 1
        );

      }
    );

    jumpButton.addEventListener(
  "click",
  async () => {

    if (
      !pdfDocument ||
      isRendering
    ) {
      return;
    }

    let targetPage =
      Number(pageInput.value);

    if (!Number.isFinite(targetPage)) {
      return;
    }

    targetPage =
      Math.floor(targetPage);

    /*
      範囲外なら自動補正
    */

    targetPage =
      Math.max(
        1,
        Math.min(
          targetPage,
          pdfDocument.numPages
        )
      );

    pageInput.value =
      targetPage;

    await renderPage(
      targetPage
    );

  }
);

    pageInput.addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {

      event.preventDefault();

      jumpButton.click();

      pageInput.blur();

    }

  }
);



    /* =========================
       自動再生
       ========================= */

    function startPlayback() {

      if (
        !pdfDocument ||
        pdfDocument.numPages <= 1
      ) {
        return;
      }


      isPlaying = true;


      playButton.textContent =
        "⏸ 一時停止";


      /*
        3秒ごとに次ページへ。
      */

      playTimer =
        setInterval(
          async () => {

            if (isRendering) {
              return;
            }


            /*
              最終ページまで来たら
              今回は停止します。
              ループは次のSTEPで追加。
            */

            if (
  currentPage >=
  pdfDocument.numPages
) {

  if (loopToggle.checked) {

    await renderPage(1);

  } else {

    stopPlayback();

  }

  return;
}


await renderPage(
  currentPage + 1
);

          },

          slideInterval
        );

    }


    function stopPlayback() {

      isPlaying = false;


      playButton.textContent =
        "▶︎ 再生";


      if (playTimer) {

        clearInterval(
          playTimer
        );

        playTimer = null;

      }

    }


    playButton.addEventListener(
      "click",
      () => {

        if (isPlaying) {

          stopPlayback();

        } else {

          startPlayback();

        }

      }
    );



    /* =========================
       PDF選択
       ========================= */

    pdfInput.addEventListener(
      "change",
      async () => {

        const file =
          pdfInput.files[0];


        if (!file) {
          return;
        }


        stopPlayback();


        loading.style.display =
          "flex";


        errorMessage.style.display =
          "none";


        try {

          const arrayBuffer =
            await file.arrayBuffer();


          pdfDocument =
            await pdfjsLib
              .getDocument({
                data: arrayBuffer
              })
              .promise;


          currentPage = 1;

          pageInput.value = 1;

pageInput.max =
  pdfDocument.numPages;

jumpTotal.textContent =
  `/ ${pdfDocument.numPages}`;


          fileName.textContent =
            file.name;


          startScreen.style.display =
            "none";

          viewerScreen.style.display =
            "flex";


          /*
            レイアウトが確定してから
            PDFを描画します。
          */

          await new Promise(
            resolve =>
              requestAnimationFrame(
                resolve
              )
          );


          await renderPage(1);


        } catch (error) {

          console.error(
            "PDF load error:",
            error
          );


          errorMessage.textContent =
            "PDFを読み込めませんでした。";


          errorMessage.style.display =
            "block";


          startScreen.style.display =
            "flex";

          viewerScreen.style.display =
            "none";

        }


        loading.style.display =
          "none";

      }
    );



    /* =========================
       画面回転対応
       ========================= */

    let resizeTimer = null;


    window.addEventListener(
      "resize",
      () => {

        if (!pdfDocument) {
          return;
        }


        clearTimeout(
          resizeTimer
        );


        resizeTimer =
          setTimeout(
            () => {

              /*
                同じページを
                新しい画面サイズで再描画
              */

              isRendering = false;

              renderPage(
  currentPage,
  false
);

            },
            200
          );

      }
    );

  </script>

</body>
</html>
